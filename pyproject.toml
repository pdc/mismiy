[project]
name = "mismiy"
version = "0.3.0.dev"
description = "Yet another static site generator."
authors = [{ name = "Damian Cugley", email = "pdc@alleged.org.uk" }]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "strictyaml >= 1.7.3, < 2",
    "mistletoe >= 1.3.0, < 2",
    "chevron >= 0.14.0, < 0.15.0",
    "watchdog >= 4.0.0, < 5.0",
    "babel (>=2.18.0,<3.0.0)",
]
requires-python = ">= 3.11, < 4"

[project.urls]
homepage = "https://mismiy.dev"
source = "https://github.com/pdc/mismiy"
changelog = "https://raw.githubusercontent.com/pdc/mismiy/refs/heads/develop/CHANGELOG.md"

[project.scripts]
mismiy = 'mismiy.command:main'

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
]

[tool.isort]
profile = "black"

[tool.basedpyright]
# On of: off", "basic", "standard", "strict", "recommended", "all"
typeCheckingMode = "standard"
reportUnusedCallResult = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
