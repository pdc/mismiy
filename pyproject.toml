[project]
name = "mismiy"
version = "0.2.0"
description = "Yet another static site generator."
authors = [{ name = "Damian Cugley", email = "pdc@alleged.org.uk" }]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "strictyaml >= 1.7.3, < 2",
    "mistletoe >= 1.3.0, < 2",
    "chevron >= 0.14.0, < 0.15.0",
    "watchdog >= 4.0.0, < 5.0",
]
requires-python = ">= 3.10, < 4"

[project.urls]
homepage = "https://mismiy.dev"
source = "https://github.com/pdc/mismiy"
changelog = "https://raw.githubusercontent.com/pdc/mismiy/refs/heads/develop/CHANGELOG.md"

[tool.poetry]


[tool.poetry.dependencies]
python = "^3.10"


[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
flake8 = "^7.3.0"
isort = "^8.0.1"
pytest = "^9.1.1"

[tool.poetry.scripts]
mismiy = 'mismiy.command:main'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
