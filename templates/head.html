<meta charset=UTF-8>
<title>{{#title}}{{.}} – {{/title}}{{site.title}}</title>
<link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml">
<link rel="icon" href="/icon.32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icon.16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/icon.180.png" sizes="180x180" type="image/png">
{{#summary}}<meta name="description" content="{{.}}">{{/summary}}
<meta property="og:title" content="{{title}}">
<meta property="og:site_name" content="{{site.title}}">
{{#figures_by_id.hero}}
<meta property="og:image" content="{{src}}">
<meta property="og:image:alt" content="{{description}}">
<meta property="og:image:width" content="{{width}}">
<meta property="og:image:height" content="{{height}}">
{{/figures_by_id.hero}}
{{#data_json}}
<script type="application/ld+json">
    {{{.}}}
</script>
{{/data_json}}
{{#links}}
<link rel={{rel}} href="{{href}}"{{#type}} type="{{type}}"{{/type}}>
{{/links}}
<meta name="viewport" content="width=device-width, initial-scale=1">
